source = /home/amit/.config/hypr/colors.conf

#   ____  _        _   _      _   _                  
#  / ___|| |_ __ _| |_(_) ___| \ | | _____   ____ _ 
#  \___ \| __/ _` | __| |/ __|  \| |/ _ \ \ / / _` |
#   ___) | || (_| | |_| | (__| |\  | (_) \ V / (_| |
#  |____/ \__\__,_|\__|_|\___|_| \_|\___/ \_/ \__,_|
#
#  Design: "Glass Vault" — Floating frosted card with glow horizon lines
#

# ==========================
# BACKGROUND — Heavy cinematic blur
# ==========================
background {
    monitor =
    path = /home/amit/.config/hypr/wallpapers/prime2.png
    color = $bg_rgba

    blur_passes = 5
    blur_size = 9
    noise = 0.0117
    contrast = 0.8500
    brightness = 0.6500
    vibrancy = 0.2800
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, easeOutExpo
    animation = fadeOut, 1, 5, easeOutExpo
}

# ==========================
# ACCENT: HORIZON LINES (frame the card, glow cyan)
# ==========================

# Top horizon glow line
shape {
    monitor =
    size = 1000, 1
    color = rgba(0, 255, 255, 0.25)
    rounding = 0
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    position = 0, 275
    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 12
    shadow_color = rgba(0, 255, 255, 0.5)
    shadow_boost = 2.5
}

# Bottom horizon glow line
shape {
    monitor =
    size = 1000, 1
    color = rgba(0, 255, 255, 0.10)
    rounding = 0
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    position = 0, -285
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 255, 255, 0.25)
    shadow_boost = 1.8
}

# ==========================
# MAIN GLASS CARD (frosted panel)
# ==========================
shape {
    monitor =
    size = 640, 520
    color = rgba(6, 10, 18, 0.62)
    rounding = 30
    border_size = 1
    border_color = rgba(0, 255, 255, 0.10)
    position = 0, -5
    halign = center
    valign = center

    shadow_passes = 8
    shadow_size = 40
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.2
}

# ==========================
# INNER TOP: GLOWING CYAN PILL INDICATOR
# ==========================
shape {
    monitor =
    size = 48, 4
    color = rgba(0, 255, 255, 0.90)
    rounding = 2
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    position = 0, 220
    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 8
    shadow_color = rgba(0, 255, 255, 0.70)
    shadow_boost = 3.0
}

# ==========================
# SUBTLE CLOCK HALO (circular glow behind clock digits)
# ==========================
shape {
    monitor =
    size = 420, 200
    color = rgba(0, 255, 255, 0.025)
    rounding = 100
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    position = 0, 75
    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 35
    shadow_color = rgba(0, 255, 255, 0.12)
    shadow_boost = 2.0
}

# ==========================
# WIDGET 1 — TIME-OF-DAY GREETING (top of card)
# ==========================
label {
    monitor =
    text = cmd[update:60000] /home/amit/.config/hypr/scripts/hyprlock_top_greeting.sh
    color = rgba(200, 200, 200, 0.75)
    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, 195
    halign = center
    valign = center
}

# ==========================
# WIDGET 2 — DATE (full format, muted)
# ==========================
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  ·  %d %B %Y')"
    color = rgba(160, 160, 160, 0.65)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Light

    position = 0, 168
    halign = center
    valign = center
}

# ==========================
# WIDGET 3 — BIG CLOCK (HH:MM + inline cyan :SS + AM/PM)
# ==========================
label {
    monitor =
    text = cmd[update:1000] /home/amit/.config/hypr/scripts/hyprlock_time_anim.sh
    color = rgba(235, 235, 235, 0.92)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraLight

    position = 0, 72
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 255, 255, 0.20)
    shadow_boost = 1.5
}

# ==========================
# INNER SEPARATOR LINE
# ==========================
shape {
    monitor =
    size = 500, 1
    color = rgba(255, 255, 255, 0.07)
    rounding = 0
    border_size = 0
    border_color = rgba(0, 0, 0, 0)
    position = 0, -90
    halign = center
    valign = center
}

# ==========================
# WIDGET 4 — PERSONAL GREETING
# ==========================
label {
    monitor =
    text = Hi, <span foreground='##$accent_hex'><b>Amit</b></span>  ·  Unlock to continue
    color = rgba(180, 180, 180, 0.70)
    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -115
    halign = center
    valign = center
}

# ==========================
# WIDGET 5 — PASSWORD INPUT (Glassmorphic pill)
# ==========================
input-field {
    monitor =
    size = 330, 50
    outline_thickness = 1
    dots_size = 0.20
    dots_spacing = 0.40
    dots_center = true

    outer_color = rgba(0, 255, 255, 0.28)
    inner_color = rgba(4, 8, 16, 0.72)
    font_color = $text_color

    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##$text_hex"> Enter Password</span></i>
    hide_input = false

    capslock_color = $fail_color
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i><span foreground="##$fail_hex">✗  Wrong password</span></i>
    fail_transition = 0

    rounding = 30
    position = 0, -185
    halign = center
    valign = center
}

# ==========================
# WIDGET 6 — CAPS LOCK WARNING (dynamic, invisible when off)
# ==========================
label {
    monitor =
    text = cmd[update:500] cat /sys/class/leds/*::capslock/brightness 2>/dev/null | grep -q 1 && echo "⚠  CAPS LOCK ON" || echo ""
    color = $fail_color
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -235
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(255, 0, 0, 0.35)
}