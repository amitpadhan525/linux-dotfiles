$wall = /home/amit/.config/hypr/wallpapers/lockscreen.png
source = /home/amit/.config/hypr/colors.conf

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}

# BACKGROUND
background {
    path = $wall
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] source ~/.config/hypr/colors.sh; H=$(date +"%I"); M=$(date +"%M"); S=$(date +"%S"); echo "<span font_features=\"zero=0\"><b>${H}<span letter_spacing=\"-25000\" foreground=\"${accent}\">:</span>${M}</b><span size=\"61440\" foreground=\"${accent_two}\"><b>${S}</b></span></span>"
    color = $text_rgba
    font_size = 180
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $accent_rgba
    font_size = 22
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# PROFILE PICTURE
image {
    monitor =
    path = ~/.config/hypr/wallpapers/me.jpeg
    size = 150
    border_size = 4
    border_color = $accent_two_rgba
    rounding = -1
    position = 0, -160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# GREETING
label {
    monitor =
    text = cmd[update:60000] echo "Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi), <b>$(echo $USER | tr '[:lower:]' '[:upper:]')</b>"
    color = $text_rgba_dim
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, 270
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $border_rgba
    inner_color = $bg_rgba
    font_color = $text_rgba
    fade_on_empty = false
    placeholder_text = Enter Password
    hide_input = false
    position = 0, -280
    halign = center
    valign = center
    rounding = -1
    check_color = $check_color
    fail_color = $fail_color
    capslock_color = rgba(240, 160, 40, 0.6)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
}
