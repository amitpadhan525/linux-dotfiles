source = ~/.config/hypr/colors.conf


background {
    monitor =
    path = ~/.config/hypr/wallpapers/lockscreen.png
    color = $bg_rgba

    # Raw wallpaper with blur only
    blur_passes = 4
    blur_size = 7
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}


# ==========================
# USER GREETING (Dynamic - Top of Screen)
# ==========================
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/greeting.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 28
    font_family = Outfit
    
    position = 0, -60
    halign = center
    valign = top

    shadow_passes = 0
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)
}

# ==========================
# DYNAMIC DATE WIDGET (Editorial Spaced)
# ==========================
label {
    monitor =
    text = cmd[update:43200000] echo "<span weight='ultralight' letter_spacing='4000'>$(date +'%A, %B %d' | tr a-z A-Z)</span>"
    color = rgba(255, 255, 255, 0.65)
    font_size = 12
    font_family = Outfit
    
    position = 0, 330
    halign = center
    valign = center

    shadow_passes = 0
}

# ==========================
# CLOCK TEXT (Bebas Neue Font - Center High)
# ==========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I%M')"
    color = rgb(a0a0a0)
    font_size = 300
    font_family = Bebas Neue
    
    position = 0, 110
    halign = center
    valign = center

    shadow_passes = 0
}


# ==========================
# PASSWORD INPUT FIELD (Glassmorphic + Accent Icon)
# ==========================
input-field {
    monitor =
    size = 280, 42
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(255, 255, 255, 0.12) rgba(255, 255, 255, 0.03) 45deg
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(255, 255, 255, 0.8)
    
    fade_on_empty = false
    font_family = Outfit
    placeholder_text = <span font_family='Outfit' weight='light' letter_spacing='2000' foreground='##ffffff72'>PASSWORD</span>
    hide_input = false
    rounding = 24
    
    check_color = rgba(255, 255, 255, 0.15)
    fail_color = rgba(248, 113, 113, 0.6)
    fail_text = <span foreground='##f87171cc'>wrong password</span>
    fail_transition = 300
    
    position = 0, -110
    halign = center
    valign = center

    shadow_passes = 0
}

# ==========================
# CAPS LOCK WARNING
# ==========================
label {
    monitor =
    text = cmd[update:500] cat /sys/class/leds/*::capslock/brightness 2>/dev/null | grep -q 1 && echo "CAPS LOCK IS ON" || echo ""
    color = rgba(248, 113, 113, 0.65)
    font_size = 10
    font_family = Outfit
    
    position = 0, -170
    halign = center
    valign = center
}


# Battery indicator removed to keep top-right clean


