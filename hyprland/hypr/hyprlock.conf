source = /home/amit/.config/hypr/colors.conf

#   ____  _        _   _      _   _                  
#  / ___|| |_ __ _| |_(_) ___| \ | | _____   ____ _ 
#  \___ \| __/ _` | __| |/ __|  \| |/ _ \ \ / / _` |
#   ___) | || (_| | |_| | (__| |\  | (_) \ V / (_| |
#  |____/ \__\__,_|\__|_|\___|_| \_|\___/ \_/ \__,_|
#
#  Design: "Ultimate Glassmorphic Edition - Bebas Neue Duotone"
#

background {
    monitor =
    path = /home/amit/.config/hypr/wallpapers/BMW.jpg
    color = $bg_rgba

    # Premium Liquid Glass Blur effect (Subtle Blur)
    blur_passes = 4
    blur_size = 7
    noise = 0.012
    contrast = 1.4
    brightness = 0.75
    vibrancy = 0.9
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}


# ==========================
# USER GREETING (Dynamic - Top of Screen)
# ==========================
label {
    monitor =
    text = cmd[update:60000] /home/amit/.config/hypr/scripts/greeting.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 28
    font_family = Outfit
    
    position = 0, -60
    halign = center
    valign = top

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)
}

# ==========================
# DYNAMIC DATE WIDGET (Editorial Spaced)
# ==========================
label {
    monitor =
    text = cmd[update:43200000] echo "<span letter_spacing='3000'>$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(255, 255, 255, 0.55)
    font_size = 20
    font_family = Outfit
    
    position = 0, -20
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.2)
}

# ==========================
# CLOCK TEXT (Bebas Neue Font - Center High)
# ==========================
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='-2000'>$(date +'%H%M')</span>"
    color = $accent
    font_size = 280
    font_family = Bebas Neue
    
    position = 0, 210
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.25)
    shadow_boost = 1.2
}

# ==========================
# PASSWORD INPUT FIELD (Glassmorphic + Accent Icon)
# ==========================
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.40
    dots_center = true
    dots_rounding = -1
    
    # Liquid glass styling: reflective gradient border & high-transparency inner glass color
    outer_color = rgba(255, 255, 255, 0.28) rgba(255, 255, 255, 0.08) 45deg
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = $text_rgba
    
    fade_on_empty = true
    fade_timeout = 2000
    font_family = Outfit
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" foreground='#$accent_hex'>󰌾</span>  <i>Enter Password...</i>
    hide_input = false
    rounding = 24
    
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>✗ Wrong password</i>
    fail_transition = 300
    
    position = 0, -110
    halign = center
    valign = center

    # Subtle floating shadow to give the glass bar elevation
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.2)
    shadow_boost = 1.2
}

# ==========================
# CAPS LOCK WARNING
# ==========================
label {
    monitor =
    text = cmd[update:500] cat /sys/class/leds/*::capslock/brightness 2>/dev/null | grep -q 1 && echo "⚠  CAPS LOCK ON" || echo ""
    color = $fail_color
    font_size = 11
    font_family = Outfit
    
    position = 0, -170
    halign = center
    valign = center
}

# ==========================
# SYSTEM STATUS BAR (Battery Indicator Capsule)
# ==========================
shape {
    monitor =
    size = 120, 36
    color = rgba(0, 0, 0, 0.25)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.15)
    
    position = -90, -48
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] /home/amit/.config/hypr/scripts/battery.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    
    position = -130, -58
    halign = right
    valign = top
}

