source = ~/.config/hypr/colors.conf


background {
    monitor =
    path = ~/.config/hypr/wallpapers/lockscreen.png
    color = $bg_rgba

    # Premium deep blur & saturated glassmorphism
    blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 1.05
    brightness = 0.75
    vibrancy = 0.35
    vibrancy_darkness = 0.05
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
    fail_timeout = 1000
}


# ==========================
# CLOCK TEXT (Bebas Neue Font - Center High)
# ==========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I%M')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 300
    font_family = Bebas Neue
    
    position = 0, 110
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
}


# ==========================
# DYNAMIC GREETING
# ==========================
label {
    monitor =
    text = cmd[update:60000] echo "$(date +%H | awk '{if ($1 < 12) print "GoodMorning"; else if ($1 < 18) print "GoodAfterNoon"; else print "GoodEvining"}'), <span foreground='##$(grep 'accent_hex =' ~/.config/hypr/colors.conf | cut -d' ' -f3)'>AMIT</span>"
    color = $text_rgba_dim
    font_size = 36
    font_family = Outfit
    
    position = 0, -80
    halign = center
    valign = top

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}


# ==========================
# DATE WIDGET
# ==========================
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $accent_two
    font_size = 26
    font_family = Outfit
    
    position = 0, -150
    halign = center
    valign = top

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}


# ==========================
# PASSWORD INPUT FIELD (Cyberpunk Secure Terminal)
# ==========================
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    
    # Soft glass outline matching clock tone & deep black glass fill
    outer_color = rgba(255, 255, 255, 0.25) rgba(255, 255, 255, 0.05) 45deg
    inner_color = rgba(10, 12, 11, 0.85)
    
    # Neon accent colored password dots
    font_color = $accent
    font_family = Outfit
    
    fade_on_empty = false
    placeholder_text = <span font_family='Outfit' size='9pt' weight='bold' letter_spacing='3000' foreground='##ffffff66'>SECURED SESSION</span>
    hide_input = false
    rounding = -1
    
    # Custom authorization states
    check_color = $accent_two
    fail_color = $fail_color
    fail_text = <span font_family='Outfit' size='9pt' weight='bold' letter_spacing='1500' foreground='##$fail_hex'>ACCESS DENIED ($ATTEMPTS)</span>
    fail_transition = 300
    
    capslock_color = $accent_two
    
    position = 0, -110
    halign = center
    valign = center

    # Neutral drop shadow (no colored glow)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}


# ==========================
# SYSTEM BATTERY STATUS
# ==========================
label {
    monitor =
    text = cmd[update:10000] echo "Battery: $(cat /sys/class/power_supply/BAT0/capacity)% $([ "$(cat /sys/class/power_supply/BAT0/status)" = "Charging" ] && echo '⚡')"
    color = rgba(255, 255, 255, 0.4)
    font_size = 14
    font_family = Outfit
    
    position = 0, 40
    halign = center
    valign = bottom

    shadow_passes = 0
}


