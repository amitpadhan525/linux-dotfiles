source = /home/amit/.config/hypr/colors.conf

#   ____  _        _   _      _   _                  
#  / ___|| |_ __ _| |_(_) ___| \ | | _____   ____ _ 
#  \___ \| __/ _` | __| |/ __|  \| |/ _ \ \ / / _` |
#   ___) | || (_| | |_| | (__| |\  | (_) \ V / (_| |
#  |____/ \__\__,_|\__|_|\___|_| \_|\___/ \_/ \__,_|
#
#  Design: "Ultimate Glassmorphic Edition - Bebas Neue Duotone"
#

background {
    monitor =
    path = /home/amit/.config/hypr/wallpapers/greed_wallpaper.jpg
    color = $bg_rgba

    # Raw wallpaper with blur only
    blur_passes = 4
    blur_size = 7
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}


# ==========================
# USER GREETING (Dynamic - Top of Screen)
# ==========================
label {
    monitor =
    text = cmd[update:60000] /home/amit/.config/hypr/scripts/greeting.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 28
    font_family = Outfit
    
    position = 0, -60
    halign = center
    valign = top

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)
}

# ==========================
# DYNAMIC DATE WIDGET (Editorial Spaced)
# ==========================
label {
    monitor =
    text = cmd[update:43200000] echo "<span weight='ultralight' letter_spacing='3000'>$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(255, 255, 255, 0.55)
    font_size = 20
    font_family = Outfit
    
    position = 0, 310
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.2)
}

# ==========================
# CLOCK TEXT (Bebas Neue Font - Center High)
# ==========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I%M')"
    color = $accent
    font_size = 280
    font_family = Bebas Neue
    
    position = 0, 110
    halign = center
    valign = center

    # Subtle dark shadow behind the numbers
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)
    shadow_boost = 1.0
}

# ==========================
# CLOCK RUNWAY / SEPARATOR
# ==========================
shape {
    monitor =
    size = 250, 1
    color = rgba(255, 255, 255, 0.12)
    rounding = 0
    
    position = 0, 260
    halign = center
    valign = center
}

# ==========================
# PASSWORD INPUT FIELD (Glassmorphic + Accent Icon)
# ==========================
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.40
    dots_center = true
    dots_rounding = -1
    
    # Glassmorphic button: dark green border & darker glass fill
    outer_color = rgba(0, 80, 56, 0.65) rgba(0, 255, 179, 0.25) 45deg
    inner_color = rgba(15, 10, 10, 0.5)
    font_color = rgb(0, 255, 179)
    
    fade_on_empty = false
    font_family = Outfit
    placeholder_text = <span font_family='Outfit' weight='bold' letter_spacing='1500' foreground='##00ffb3'>ENTER PASSWORD</span>
    hide_input = false
    rounding = 24
    
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>✗ Wrong password</i>
    fail_transition = 300
    
    position = 0, -110
    halign = center
    valign = center

    # Subtle dark shadow under the button
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.2)
    shadow_boost = 1.0
}

# ==========================
# CAPS LOCK WARNING
# ==========================
label {
    monitor =
    text = cmd[update:500] cat /sys/class/leds/*::capslock/brightness 2>/dev/null | grep -q 1 && echo "⚠  CAPS LOCK ON" || echo ""
    color = $fail_color
    font_size = 11
    font_family = Outfit
    
    position = 0, -170
    halign = center
    valign = center
}


# Battery indicator removed to keep top-right clean


