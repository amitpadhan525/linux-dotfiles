############################################################
# 🧠 FONT & TEXT
############################################################
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
font_size          12.5
adjust_line_height 110%
enable_ligatures   always

############################################################
# 🎯 CURSOR (CLEAN + VISIBLE + NON-DISTRACTING)
############################################################
cursor                 #ffffff
cursor_text_color      #111111
cursor_shape           block
cursor_blink_interval  0.6
cursor_trail           0

############################################################
# 🪟 WINDOW LOOK & BORDERS
############################################################
# Fine padding (top right bottom left)
window_padding_width    12 18 12 18

# Transparency (works best with compositor like Hyprland)
background_opacity      1.0

hide_window_decorations yes
confirm_os_window_close 0
dynamic_title           yes

# Neon Border Accents (may be overridden by WM)
active_border_color     #00ffe1
inactive_border_color   #222222
window_border_width     1pt
draw_minimal_borders    yes
############################################################
# 🌈 ULTRA HIGH CONTRAST (FAST READING MODE)
############################################################
foreground #ffffff
background #000000

selection_background #666666
selection_foreground #ffffff

# Strong, saturated colors
color0  #000000   # black
color1  #ff0000   # pure red (errors)
color2  #00ff00   # pure green (success)
color3  #ffff00   # bright yellow (warnings)
color4  #0080ff   # strong blue (directories)
color5  #ff00ff   # magenta (special)
color6  #00ffff   # cyan (info)
color7  #ffffff   # white (default)

# Bright versions (even stronger)
color8  #808080
color9  #ff3333
color10 #33ff33
color11 #ffff33
color12 #3399ff
color13 #ff33ff
color14 #33ffff
color15 #ffffff
############################################################
# 📑 TABS (POWERLINE STYLE)
############################################################
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted

active_tab_foreground   #000000
active_tab_background   #00ff9c
active_tab_font_style   bold

inactive_tab_foreground #888888
inactive_tab_background #1a1a1a
inactive_tab_font_style normal

############################################################
# 🔗 URLS & MOUSE
############################################################
url_color       #00bfff
url_style       curly
detect_urls     yes
copy_on_select  yes
mouse_hide_wait 3.0

############################################################
# ⚡ PERFORMANCE & BELL
############################################################
repaint_delay        10
input_delay          3
sync_to_monitor      yes

enable_audio_bell    no
visual_bell_duration 0.0

############################################################
# 📜 SCROLLBACK
############################################################
scrollback_lines 20000

############################################################
# ⌨️ KEYBINDINGS (POWER USER SETUP)
############################################################
kitty_mod ctrl+shift

# Window management
map kitty_mod+enter new_window
map kitty_mod+d     new_window
map kitty_mod+w     close_window

# Navigation
map kitty_mod+l     next_window
map kitty_mod+h     previous_window

# Splits (like tmux)
map kitty_mod+right split_window horizontally
map kitty_mod+down  split_window vertically

# Clipboard
map kitty_mod+c     copy_to_clipboard
map kitty_mod+v     paste_from_clipboard

# Reload config instantly
map kitty_mod+f5    load_config_file

############################################################
# 🔥 TERMINAL IDENTITY
############################################################
term xterm-kitty