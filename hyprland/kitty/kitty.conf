############################
# 🧠 FONT & TEXT
############################
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
font_size          12.5
adjust_line_height 110%

############################
# 🎯 CURSOR
############################
cursor_shape        beam
cursor_blink_interval 0.6
cursor #00ffe1
cursor_text_color #000000

############################
# 🪟 WINDOW LOOK
############################
window_padding_width 12
background_opacity   1.0
hide_window_decorations yes

############################
# 🌈 COLORS (NEON MAX)
############################
foreground #f8f8f2
background #000000

selection_foreground #000000
selection_background #00ffe1

# Normal
color0  #000000
color1  #ff0055
color2  #00ff9c
color3  #ffe600
color4  #00bfff
color5  #ff00ff
color6  #00ffe1
color7  #ffffff

# Bright
color8  #666666
color9  #ff4d88
color10 #00ffcc
color11 #ffff66
color12 #33ccff
color13 #ff66ff
color14 #66ffff
color15 #ffffff

bold_is_bright yes

############################
# ⚡ PERFORMANCE
############################
enable_audio_bell no
visual_bell_duration 0.0
repaint_delay 10
input_delay 3
sync_to_monitor yes

############################
# 📜 SCROLLBACK
############################
scrollback_lines 20000

############################
# 🧩 TABS
############################
tab_bar_edge top
tab_bar_style powerline

############################
# ⌨️ KEYBINDINGS
############################
map ctrl+shift+enter new_window
map ctrl+shift+d new_window
map ctrl+shift+l next_window
map ctrl+shift+h previous_window
map ctrl+shift+w close_window

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

############################
# 🧠 RENDERING
############################
enable_ligatures yes

############################
# 🖱️ MOUSE
############################
copy_on_select yes

############################
# 🔥 TERMINAL IDENTITY
############################
term xterm-kitty