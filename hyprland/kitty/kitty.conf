############################################################
# 🧠 FONT & TEXT
############################################################
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
font_size          12.5
adjust_line_height 110%
enable_ligatures   yes

############################################################
# 🎯 CURSOR
############################################################
cursor                 #00ffe1
cursor_text_color      #000000
cursor_shape           beam
cursor_blink_interval  0.6

############################################################
# 🪟 WINDOW LOOK & BORDERS
############################################################
window_padding_width    12
background_opacity      1.0
hide_window_decorations yes
confirm_os_window_close 0

# Neon Border Accents
active_border_color     #00ffe1
inactive_border_color   #222222
window_border_width     1pt
draw_minimal_borders    yes

############################################################
# 🌈 COLORS (NEON MAX)
############################################################
foreground #f8f8f2
background #000000

selection_foreground #000000
selection_background #00ffe1

# Normal Colors
color0  #000000
color1  #ff0055
color2  #00ff9c
color3  #ffe600
color4  #00bfff
color5  #ff00ff
color6  #00ffe1
color7  #ffffff

# Bright Colors
color8  #666666
color9  #ff4d88
color10 #00ffcc
color11 #ffff66
color12 #33ccff
color13 #ff66ff
color14 #66ffff
color15 #ffffff

bold_is_bright yes

############################################################
# 📑 TABS (POWERLINE NEON)
############################################################
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #000000
active_tab_background   #00ff9c
active_tab_font_style   bold
inactive_tab_foreground #888888
inactive_tab_background #1a1a1a
inactive_tab_font_style normal

############################################################
# 🔗 URLS & MOUSE
############################################################
url_color       #00bfff
url_style       curly
detect_urls     yes
copy_on_select  yes
mouse_hide_wait 3.0

############################################################
# ⚡ PERFORMANCE & BELL
############################################################
repaint_delay        10
input_delay          3
sync_to_monitor      yes
enable_audio_bell    no
visual_bell_duration 0.0

############################
# 📜 SCROLLBACK
############################
scrollback_lines 20000

############################################################
# ⌨️ KEYBINDINGS
############################################################
kitty_mod ctrl+shift

map kitty_mod+enter new_window
map kitty_mod+d     new_window
map kitty_mod+l     next_window
map kitty_mod+h     previous_window
map kitty_mod+w     close_window

map kitty_mod+c     copy_to_clipboard
map kitty_mod+v     paste_from_clipboard

# Reload config shortcut
map kitty_mod+f5    load_config_file

############################################################
# 🔥 TERMINAL IDENTITY
############################################################
term xterm-kitty